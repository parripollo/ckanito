# Dataset schema of the demo instance (ckanext-scheming). It keeps CKAN's
# default fields and adds the metadata an open data portal usually asks
# for. `ckan ckanito seed-demo` fills every field.
#
#   scheming.dataset_schemas = ckan.cli:ckanito_demo_schema.yaml

scheming_version: 2
dataset_type: dataset
about: Demo dataset schema
about_url: https://ckanito.cluster311.com/extensions.html

dataset_fields:

- field_name: title
  label: Title
  preset: title
  form_placeholder: eg. Air quality, daily measurements

- field_name: name
  label: URL
  preset: dataset_slug
  form_placeholder: eg. air-quality

- field_name: notes
  label: Description
  form_snippet: markdown.html
  form_placeholder: What the data is, how it was collected, known limits

- field_name: tag_string
  label: Tags
  preset: tag_string_autocomplete
  form_placeholder: eg. air, pollution, health

- field_name: license_id
  label: License
  form_snippet: license.html

- field_name: owner_org
  label: Organization
  preset: dataset_organization

- field_name: theme
  label: Themes
  preset: multiple_checkbox
  choices:
  - value: environment
    label: Environment
  - value: transport
    label: Transport
  - value: health
    label: Health
  - value: economy
    label: Economy
  - value: education
    label: Education and science
  - value: government
    label: Government

- field_name: update_frequency
  label: Update frequency
  preset: select
  required: true
  choices:
  - value: daily
    label: Daily
  - value: weekly
    label: Weekly
  - value: monthly
    label: Monthly
  - value: yearly
    label: Yearly
  - value: irregular
    label: Irregular

- field_name: temporal_start
  label: Period covered, from
  preset: date

- field_name: temporal_end
  label: Period covered, to
  preset: date

- field_name: geographic_coverage
  label: Geographic coverage
  preset: select
  choices:
  - value: city
    label: City of Cordoba
  - value: province
    label: Province of Cordoba
  - value: country
    label: Argentina

- field_name: language
  label: Language
  preset: select
  choices:
  - value: es
    label: Spanish
  - value: en
    label: English
  - value: pt
    label: Portuguese

- field_name: contact_name
  label: Contact
  form_placeholder: Who answers questions about this data

- field_name: contact_email
  label: Contact email
  display_snippet: email.html
  display_email_name_field: contact_name
  validators: ignore_missing unicode_safe email_validator

- field_name: url
  label: Source
  form_placeholder: https://example.org/data
  display_snippet: link.html

- field_name: version
  label: Version
  validators: ignore_missing unicode_safe package_version_validator
  form_placeholder: '1.0'

- field_name: author
  label: Author

- field_name: author_email
  label: Author email
  display_snippet: email.html
  display_email_name_field: author

- field_name: maintainer
  label: Maintainer

- field_name: maintainer_email
  label: Maintainer email
  display_snippet: email.html
  display_email_name_field: maintainer


resource_fields:

- field_name: url
  label: URL
  preset: resource_url_upload

- field_name: name
  label: Name
  form_placeholder: eg. Measurements, January 2026

- field_name: description
  label: Description
  form_snippet: markdown.html

- field_name: format
  label: Format
  preset: resource_format_autocomplete

- field_name: encoding
  label: Character encoding
  preset: select
  choices:
  - value: UTF-8
    label: UTF-8
  - value: ISO-8859-1
    label: ISO-8859-1 (Latin 1)
